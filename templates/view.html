<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* عنوان Verify Document */
        .header-box {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* حقل أدخل رقم المستند */
        .input-label {
            color: #555555;
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }

        .input-box {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: #ffffff;
            color: #333;
            outline: none;
        }

        /* أزرار Search و Download */
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background-color: #333333;
        }

        /* حاوية عارض الـ PDF مع الشريط العلوي المطلوب */
        .pdf-viewer-container {
            width: 100%;
            height: 75vh;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        /* الشريط العلوي للعارض بالشكل المطلوب */
        .pdf-toolbar {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            background-color: #3a3a3a;
        }

        /* نافذة الـ PDF */
        .pdf-frame {
            flex: 1;
            width: 100%;
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مربع العنوان -->
        <div class="header-box">
            Verify Document
        </div>

        <!-- حقل ادخال رقم المستند -->
        <label class="input-label">Enter Document Number</label>
        <input type="text" class="input-box" value="{{ doc_id }}" readonly>

        <!-- الأزرار -->
        <div class="buttons-row">
            <button class="btn" onclick="location.reload();">Search</button>
            <a href="/files/{{ doc_id }}" download class="btn">Download</a>
        </div>

        <!-- حاوية الـ PDF مع الشريط العلوي المطلوب -->
        <div class="pdf-viewer-container">
            <div class="pdf-toolbar">
                <div class="toolbar-group">
                    <button class="toolbar-btn" onclick="document.getElementById('pdf-embed').contentWindow.print();">🖨️</button>
                    <a href="/files/{{ doc_id }}" download class="toolbar-btn" style="text-decoration: none;">📥</a>
                </div>
                <div class="toolbar-group">
                    <span style="font-size: 13px; color: #ccc;">Document Viewer</span>
                </div>
            </div>
            <embed id="pdf-embed" src="/files/{{ doc_id }}#toolbar=1" type="application/pdf" class="pdf-frame">
        </div>
    </div>

</body>
</html>
