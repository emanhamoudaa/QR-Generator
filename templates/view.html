<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة المستند | Verify Document</title>
    <!-- استدعاء مكتبة PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* شريط الأدوات العلوي المخصص */
        .pdf-toolbar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            background-color: #3a3a3a;
            color: #fff;
            border-color: #666;
        }
        .page-info {
            font-size: 14px;
            color: #aaa;
        }
        /* منطقة عرض الصفحات */
        #pdf-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: #121212;
        }
        canvas {
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border-radius: 4px;
            max-width: 100%;
            height: auto !important;
        }
        .loading {
            margin-top: 50px;
            font-size: 18px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- شريط التحكم الداكن المخصص -->
    <div class="pdf-toolbar">
        <div class="toolbar-group">
            <span class="page-info">الصفحة <span id="current-page">1</span> من <span id="total-pages">-</span></span>
        </div>
        <div class="toolbar-group">
            <a href="/files/{{ doc_id }}" download class="btn">
                📥 تحميل المستند
            </a>
        </div>
    </div>

    <!-- الحاوية التي سيتم رسم صفحات الـ PDF فيها -->
    <div id="pdf-container">
        <div id="loading-text" class="loading">جاري تحميل المستند...</div>
    </div>

    <script>
        // إعداد رابط المكتبة
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfUrl = '/files/{{ doc_id }}';
        const container = document.getElementById('pdf-container');
        const loadingText = document.getElementById('loading-text');

        // تحميل ملف الـ PDF ورسمه كصفحات
        pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
            loadingText.style.display = 'none';
            document.getElementById('total-pages').textContent = pdf.numPages;

            // رسم كل صفحة داخل Canvas
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    container.appendChild(canvas);
                    page.render(renderContext);
                });
            }
        }).catch(error => {
            loadingText.textContent = 'حدث خطأ أثناء تحميل المستند.';
            console.error('Error loading PDF:', error);
        });
    </script>
</body>
</html>
