<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #1a1d20;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. الشريط العلوي الرئيسي (Verify Document) */
        .top-bar {
            background-color: #0b0c0e;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #282c30;
        }

        /* 2. منطقة البحث والمدخلات */
        .search-section {
            background-color: #121417;
            padding: 12px 18px 16px 18px;
            border-bottom: 1px solid #24272c;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: #9aa0a6;
            margin-bottom: 8px;
        }

        .document-input {
            width: 100%;
            padding: 7px 10px;
            background-color: #1a1d20;
            border: 1px solid #343a40;
            color: #9aa0a6;
            font-size: 13px;
            border-radius: 2px;
            outline: none;
            margin-bottom: 12px;
            font-family: monospace;
        }

        /* 3. شريط أزرار التحكم (Search / Download) بنفس تناسب الصورة */
        .buttons-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-search {
            flex: 2;
            padding: 9px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #343a40;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: #1f2327;
        }

        .btn-download {
            flex: 1;
            padding: 9px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #343a40;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .btn-download:hover {
            background-color: #1f2327;
        }

        /* 4. منطقة عرض الـ PDF المرفوع */
        .viewer-container {
    flex: 1;
    width: 100%;
    background-color: #323639;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

#pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px;
}

#pages canvas {
    background: #fff;
    max-width: 100%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

#msg {
    text-align: center;
    padding: 24px;
    color: #cfd3d7;
    font-size: 14px;
}
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-bar">
        Verify Document
    </div>

    <!-- لوحة البحث والتحكم -->
    <div class="search-section">
        <span class="input-label">Enter Document Number</span>
        <input type="text" id="docInput" class="document-input" value="{{ doc_id }}">
        
        <div class="buttons-group">
            <button class="btn-search" onclick="searchDoc()">Search</button>
            <a href="/files/{{ doc_id }}" download class="btn-download">Download</a>
        </div>
    </div>

    <!-- حاوية عرض الـ PDF -->
    <div class="viewer-container" id="viewer">
        <div id="msg">جاري تحميل الملف...</div>
        <div id="pages"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        function searchDoc() {
            const val = document.getElementById('docInput').value.trim();
            if (val) {
                window.location.href = '/view/' + val;
            }
        }

        const url = "/files/" + {{ doc_id|tojson }};
        const viewer = document.getElementById('viewer');
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (!isMobile) {
            // اللاب: عارض Chrome الجاهز
            viewer.innerHTML = '<iframe src="' + url + '#toolbar=1&navpanes=0&scrollbar=1"></iframe>';
        } else {
            // الموبايل: نرسم الصفحات بـ PDF.js
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

            const msg = document.getElementById('msg');
            const pagesBox = document.getElementById('pages');

            pdfjsLib.getDocument(url).promise.then(async (pdf) => {
                msg.remove();
                const cssWidth = viewer.clientWidth - 20;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const base = page.getViewport({ scale: 1 });
                    const viewport = page.getViewport({ scale: (cssWidth / base.width) * dpr });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.style.width = cssWidth + 'px';
                    canvas.style.height = 'auto';
                    pagesBox.appendChild(canvas);

                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                }
            }).catch(() => {
                msg.innerHTML = 'تعذّر عرض الملف هنا. <a href="' + url + '" style="color:#8ab4f8">افتحيه من هنا</a>';
            });
        }
    </script>

</body>
</html>
