<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة المستند | Verify Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* الشريط العلوي الخاص بكِ (البحث والتحميل والتصميم القديم) */
        .top-bar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .doc-title {
            font-size: 16px;
            color: #ddd;
        }
        .btn-download {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #3a3a3a;
        }
        /* حاوية عرض الـ PDF بنفس التصميم القديم بدون أشرطة مزعجة */
        .pdf-viewer-container {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
        }
        iframe, embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الخاص بموقعك -->
    <div class="top-bar">
        <div class="doc-title">رقم المستند: {{ doc_id }}</div>
        <div>
            <a href="/files/{{ doc_id }}" download class="btn-download">📥 تحميل المستند</a>
        </div>
    </div>

    <!-- نافذة عرض الـ PDF مع إخفاء أشرطة المتصفح الإضافية باستخدام #toolbar=0 -->
    <div class="pdf-viewer-container">
        <embed src="/files/{{ doc_id }}#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" width="100%" height="100%">
    </div>

</body>
</html>
