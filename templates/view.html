<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Document</title>
    <!-- استدعاء مكتبة الأيقونات لتظهر الأيقونات بشكل احترافي -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
        }

        /* 1. الشريط العلوي الرئيسي (Verify Document) */
        .top-bar-container {
            padding: 12px 16px 8px 16px;
            background-color: #ffffff;
        }

        .top-bar {
            background-color: #1e1e1e;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            border-radius: 4px;
        }

        /* 2. منطقة البحث والمدخلات */
        .search-section {
            background-color: #ffffff;
            padding: 4px 16px 14px 16px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: #555555;
            margin-bottom: 8px;
        }

        .document-input {
            width: 100%;
            padding: 8px 12px;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            color: #212529;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            margin-bottom: 14px;
            font-family: monospace;
        }

        /* 3. أزرار البحث والتنزيل */
        .buttons-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-search, .btn-download {
            flex: 1;
            padding: 10px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .btn-search:hover, .btn-download:hover {
            background-color: #343a40;
        }

        /* 4. الحاوية المغلفة للـ PDF بمسافات جانبية متطابقة تماماً مع الأزرار فوق */
        .outer-pdf-wrapper {
            flex: 1;
            padding: 0 16px 16px 16px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 5. شريط أدوات عارض الـ PDF الداكن */
        .pdf-toolbar {
            background-color: #323639;
            color: #ffffff;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            border-bottom: 1px solid #202124;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            user-select: none;
            direction: ltr;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .toolbar-separator {
            width: 1px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }

        .page-control-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .page-num-input {
            width: 32px;
            height: 24px;
            text-align: center;
            background-color: #ffffff;
            border: 1px solid #ffffff;
            color: #000000;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }

        .page-count-text {
            color: #ffffff;
            font-size: 12px;
        }

        .zoom-select {
            background-color: #202124;
            color: #ffffff;
            border: 1px solid #5f6368;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        /* تعديل خاص بالموبايل فقط لتقليل المسافات تلقائياً بحيث يظل كل شيء داخله بدون إخفاء أي عنصر وبدون تغيير تصميم اللاب */
        @media screen and (max-width: 650px) {
            .pdf-toolbar {
                padding: 4px 6px;
                gap: 2px;
            }
            .toolbar-group {
                gap: 3px;
            }
            .toolbar-separator {
                margin: 0 2px;
            }
            .zoom-select {
                max-width: 105px; /* تصغير عرض القائمة قليلاً بالموبايل لتدخل تماماً جوه الشريط */
                padding: 2px 4px;
                font-size: 11px;
            }
            .toolbar-btn {
                font-size: 16px;
                padding: 2px 4px;
            }
        }

        /* 6. منطقة عرض الـ PDF المفصلة بالداخل */
        .viewer-container {
            flex: 1;
            width: 100%;
            background-color: #323639;
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 8px;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            direction: ltr;
        }

        .viewer-container::-webkit-scrollbar {
            width: 8px;
        }

        .viewer-container::-webkit-scrollbar-track {
            background: #323639;
        }

        .viewer-container::-webkit-scrollbar-thumb {
            background: #111111;
            border-radius: 4px;
        }

        #pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #pages canvas {
            background: #ffffff;
            width: 100%;
            max-width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        #msg {
            text-align: center;
            padding: 24px;
            color: #cfd3d7;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 1. الهيدر العلوي -->
    <div class="top-bar-container">
        <div class="top-bar">
            Verify Document
        </div>
    </div>

    <!-- 2. لوحة البحث والتحكم -->
    <div class="search-section">
        <span class="input-label">Enter Document Number</span>
        <input type="text" id="docInput" class="document-input" value="{{ doc_id }}">
        
        <div class="buttons-group">
            <button class="btn-search" onclick="searchDoc()">Search</button>
            <a href="/files/{{ doc_id }}" download class="btn-download">Download</a>
        </div>
    </div>

    <!-- 3. الحاوية المغلفة للـ PDF -->
    <div class="outer-pdf-wrapper">
        
        <!-- شريط أدوات الـ PDF -->
        <div class="pdf-toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn" title="Previous Page"><iconify-icon icon="mdi:chevron-left"></iconify-icon></button>
                <button class="toolbar-btn" title="Next Page"><iconify-icon icon="mdi:chevron-right"></iconify-icon></button>
                
                <div class="page-control-box">
                    <input type="text" class="page-num-input" value="1">
                    <span class="page-count-text">of <span id="totalPagesCount">1</span></span>
                </div>

                <div class="toolbar-separator"></div>

                <button class="toolbar-btn" title="Zoom Out"><iconify-icon icon="mdi:minus"></iconify-icon></button>
                <button class="toolbar-btn" title="Zoom In"><iconify-icon icon="mdi:plus"></iconify-icon></button>

                <div class="toolbar-separator"></div>

                <select class="zoom-select">
                    <option>Automatic Zoom</option>
                    <option>Actual Size</option>
                    <option>Page Fit</option>
                    <option>50%</option>
                    <option>75%</option>
                    <option>100%</option>
                </select>
            </div>

            <div class="toolbar-group">
                <a href="/files/{{ doc_id }}" download class="toolbar-btn" title="Print" style="color: #fff; text-decoration: none; display: flex; align-items: center;"><iconify-icon icon="mdi:printer-outline"></iconify-icon></a>
                <a href="/files/{{ doc_id }}" download class="toolbar-btn" title="Download" style="color: #fff; text-decoration: none; display: flex; align-items: center;"><iconify-icon icon="mdi:download-outline"></iconify-icon></a>
                <button class="toolbar-btn" title="Bookmarks"><iconify-icon icon="mdi:bookmark-outline"></iconify-icon></button>
            </div>
        </div>

        <!-- منطقة عرض الـ PDF -->
        <div class="viewer-container" id="viewer">
            <div id="msg">جاري تحميل الملف...</div>
            <div id="pages"></div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        function searchDoc() {
            const val = document.getElementById('docInput').value.trim();
            if (val) {
                window.location.href = '/view/' + val;
            }
        }

        const url = "/files/" + {{ doc_id|tojson }};
        const viewer = document.getElementById('viewer');
        const msg = document.getElementById('msg');
        const pagesBox = document.getElementById('pages');

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        pdfjsLib.getDocument(url).promise.then(async (pdf) => {
            msg.remove();
            document.getElementById('totalPagesCount').textContent = pdf.numPages;
            
            // استخدام مقياس أعلى (Scale factor) لضمان جودة فائقة الوضوح لمنع البكسلة
            const scaleFactor = 2.5; 
            const cssWidth = viewer.clientWidth - 16;

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: scaleFactor });

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                // ضبط حجم الـ CSS بالعرض المناسب للشاشة بينما الـ Canvas الداخلي عالي الدقة
                canvas.style.width = cssWidth + 'px';
                canvas.style.height = 'auto';
                canvas.style.display = 'block';
                canvas.style.marginBottom = '12px';
                pagesBox.appendChild(canvas);

                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            }
        }).catch(() => {
            msg.innerHTML = 'تعذّر عرض الملف هنا. <a href="' + url + '" style="color:#8ab4f8">افتحيه من هنا</a>';
        });).catch(() => {
            msg.innerHTML = 'تعذّر عرض الملف هنا. <a href="' + url + '" style="color:#8ab4f8">افتحيه من هنا</a>';
        });
    </script>

</body>
</html>
