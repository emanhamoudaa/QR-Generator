<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #1a1d20;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. الشريط العلوي الرئيسي (Verify Document) */
        .top-bar {
            background-color: #0b0c0e;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #282c30;
        }

        /* 2. منطقة البحث والمدخلات */
        .search-section {
            background-color: #121417;
            padding: 12px 18px 16px 18px;
            border-bottom: 1px solid #24272c;
        }

        .input-label {
            display: block;
            font-size: 12px;
            color: #9aa0a6;
            margin-bottom: 8px;
        }

        .document-input {
            width: 100%;
            padding: 7px 10px;
            background-color: #1a1d20;
            border: 1px solid #343a40;
            color: #9aa0a6;
            font-size: 13px;
            border-radius: 2px;
            outline: none;
            margin-bottom: 12px;
            font-family: monospace;
        }

        /* 3. شريط أزرار التحكم (Search / Download) بنفس تناسب الصورة */
        .buttons-group {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-search {
            flex: 2;
            padding: 9px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #343a40;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: #1f2327;
        }

        .btn-download {
            flex: 1;
            padding: 9px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #343a40;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        .btn-download:hover {
            background-color: #1f2327;
        }

        /* 4. منطقة عرض الـ PDF المرفوع */
        .viewer-container {
    flex: 1;
    width: 100%;
    background-color: #323639;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

#pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px;
}

#pages canvas {
    background: #fff;
    max-width: 100%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

#msg {
    text-align: center;
    padding: 24px;
    color: #cfd3d7;
    font-size: 14px;
}
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-bar">
        Verify Document
    </div>

    <!-- لوحة البحث والتحكم -->
    <div class="search-section">
        <span class="input-label">Enter Document Number</span>
        <input type="text" id="docInput" class="document-input" value="{{ doc_id }}">
        
        <div class="buttons-group">
            <button class="btn-search" onclick="searchDoc()">Search</button>
            <a href="/files/{{ doc_id }}" download class="btn-download">Download</a>
        </div>
    </div>

    <!-- حاوية عرض الـ PDF الديناميكية -->
    <div class="viewer-container">
        <iframe src="/files/{{ doc_id }}#toolbar=1&navpanes=0&scrollbar=1"></iframe>
    </div>

    <script>
        function searchDoc() {
            const val = document.getElementById('docInput').value.trim();
            if (val) {
                window.location.href = '/view/' + val;
            }
        }
    </script>

</body>
</html>
