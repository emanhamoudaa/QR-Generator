<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Document</title>
    <!-- استدعاء مكتبة PDF.js لعرض الـ PDF بشريط مخصص -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* عنوان Verify Document */
        .header-box {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* حقل أدخل رقم المستند */
        .input-label {
            color: #555555;
            font-size: 14px;
            margin-bottom: 6px;
            display: block;
        }

        .input-box {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            background-color: #ffffff;
            color: #333;
            outline: none;
        }

        /* أزرار Search و Download */
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn:hover {
            background-color: #333333;
        }

        /* إطار عارض الـ PDF المخصص */
        .pdf-viewer-card {
            width: 100%;
            height: 75vh;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        /* الشريط المخصص الداكن للـ PDF فقط */
        .custom-pdf-toolbar {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .tool-btn:hover {
            background-color: #444;
        }

        /* منطقة عرض صفحات الملف */
        .pdf-render-area {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-color: #333333;
            gap: 10px;
        }

        canvas {
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto !important;
        }

        .loading-text {
            color: #bbb;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- مربع العنوان (كما هو) -->
        <div class="header-box">
            Verify Document
        </div>

        <!-- حقل ادخال رقم المستند (كما هو) -->
        <label class="input-label">Enter Document Number</label>
        <input type="text" class="input-box" value="{{ doc_id }}" readonly>

        <!-- الأزرار (كما هي) -->
        <div class="buttons-row">
            <button class="btn" onclick="location.reload();">Search</button>
            <a href="/files/{{ doc_id }}" download class="btn">Download</a>
        </div>

        <!-- عارض الـ PDF مع التعديل على الشريط المخصص فقط -->
        <div class="pdf-viewer-card">
            <!-- الشريط الداكن المخصص المبدل بدل أشرطة المتصفح -->
            <div class="custom-pdf-toolbar">
                <div class="toolbar-group">
                    <button class="tool-btn" id="prev-page">❮</button>
                    <span>Page <span id="page-num">1</span> of <span id="page-count">-</span></span>
                    <button class="tool-btn" id="next-page">❯</button>
                </div>
                <div class="toolbar-group">
                    <button class="tool-btn" id="zoom-out">−</button>
                    <span id="zoom-level">100%</span>
                    <button class="tool-btn" id="zoom-in">+</button>
                </div>
            </div>

            <!-- حاوية عرض الـ PDF -->
            <div class="pdf-render-area" id="pdf-container">
                <div class="loading-text" id="loading">Loading document...</div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = '/files/{{ doc_id }}';
        let pdfDoc = null,
            pageNum = 1,
            scale = 1.0,
            container = document.getElementById('pdf-container'),
            loading = document.getElementById('loading');

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                container.innerHTML = '';
                container.appendChild(canvas);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                page.render(renderContext);

                document.getElementById('page-num').textContent = num;
                document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
            });
        }

        pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;
            renderPage(pageNum);
        }).catch(err => {
            loading.textContent = 'Failed to load PDF.';
            console.error(err);
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (pageNum <= 1) return;
            pageNum--;
            renderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            renderPage(pageNum);
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            scale += 0.2;
            renderPage(pageNum);
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (scale <= 0.4) return;
            scale -= 0.2;
            renderPage(pageNum);
        });
    </script>

</body>
</html>
